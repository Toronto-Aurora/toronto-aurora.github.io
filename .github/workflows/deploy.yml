name: Deploy Aurora site to GitHub Pages

on:
  # Auto-deploy is OFF while the site is private / not yet public.
  # To turn it on later:
  #   1. Make the repo public (GitHub Pages is free for public repos), or use a paid plan for private Pages.
  #   2. Repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
  #   3. Uncomment the `push` trigger below (and set site/base in site/astro.config.mjs
  #      if deploying to a project sub-path like username.github.io/aurora-website/).
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
